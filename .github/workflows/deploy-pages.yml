name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync src/ to docs/
        run: |
          mkdir -p docs
          rsync -av --delete src/ docs/

      - name: Write root redirect
        run: |
          cat > docs/index.html << 'EOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8" />
            <meta http-equiv="refresh" content="0; url=pages/index.html" />
            <title>Million Dollar Fist</title>
          </head>
          <body>
            <p>Redirecting... <a href="pages/index.html">Click here if not redirected.</a></p>
          </body>
          </html>
          EOF

      - name: Commit and push docs/
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/
          git diff --staged --quiet || git commit -m "chore: sync docs/ from src/ [skip ci]"
          git push
