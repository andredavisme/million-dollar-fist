<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no"/>
  <title>Street Run &mdash; Million Dollar Fist</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    * { box-sizing: border-box; margin:0; padding:0; }
    html, body { height: 100%; overflow: hidden; overscroll-behavior: none; touch-action: none; background:#0f172a; }
    #gameCanvas { display: block; touch-action: none; }
    #fingerPad, #fingerKnob { touch-action: none; }
  </style>
</head>
<body class="text-gray-100 font-sans select-none flex flex-col" style="height:100dvh">

  <nav class="shrink-0 border-b border-gray-800 px-4 py-2 flex items-center gap-4 text-sm bg-gray-950">
    <a href="index.html" class="font-bold text-white">MDF</a>
    <a href="how-it-works.html" class="text-gray-400">How It Works</a>
    <a href="game.html" class="text-gray-400">Desktop Game</a>
    <span class="text-white font-medium">Street Run</span>
  </nav>

  <div class="shrink-0 flex items-center justify-between px-4 py-1.5 bg-gray-900 border-b border-gray-800">
    <div class="flex gap-2 items-center">
      <span class="text-xs text-gray-400 uppercase tracking-widest">Blocks</span>
      <span id="scoreDisplay" class="text-white font-bold">0</span>
    </div>
    <span id="milestoneMsg" class="text-amber-400 text-xs font-semibold hidden"></span>
    <div class="flex gap-2" id="inventoryBar">
      <div id="slot0" class="w-7 h-7 rounded-full border-2 border-gray-600 bg-gray-800 flex items-center justify-center text-xs"></div>
      <div id="slot1" class="w-7 h-7 rounded-full border-2 border-gray-600 bg-gray-800 flex items-center justify-center text-xs"></div>
    </div>
  </div>

  <canvas id="gameCanvas" class="grow block"></canvas>

  <div class="shrink-0 bg-gray-950/95 border-t border-gray-800 px-4 pt-2 pb-3">
    <div class="flex items-center justify-between text-[10px] text-gray-500 uppercase tracking-widest mb-1">
      <span>← Move left/right →</span>
      <span>Finger Pad</span>
    </div>
    <div id="fingerPad" class="relative h-14 rounded-full bg-gray-900 border border-gray-700">
      <div class="absolute inset-y-0 left-1/2 w-px bg-gray-700 pointer-events-none"></div>
      <div id="fingerFill" class="absolute left-0 top-0 bottom-0 rounded-full bg-amber-500/10 pointer-events-none" style="width:50%"></div>
      <div id="fingerKnob" class="absolute top-1/2 -translate-y-1/2 w-12 h-12 rounded-full bg-amber-500 border-4 border-amber-300 shadow-lg flex items-center justify-center text-black font-bold text-lg" style="left:calc(50% - 24px)">⇆</div>
    </div>
  </div>

  <div id="overlay" class="hidden fixed inset-0 bg-black/80 flex items-center justify-center z-50 px-6">
    <div id="overlayCard" class="rounded-2xl border p-7 max-w-sm w-full text-center">
      <div id="overlayIcon" class="text-5xl mb-3"></div>
      <h2 id="overlayTitle" class="text-xl font-bold text-white mb-2"></h2>
      <p id="overlayMsg" class="text-sm text-gray-300 mb-5"></p>
      <button id="overlayBtn" class="bg-amber-500 text-black font-semibold px-6 py-2.5 rounded-lg w-full"></button>
    </div>
  </div>

<script>
const canvas = document.getElementById('gameCanvas');
function resizeCanvas() {
  canvas.width  = canvas.clientWidth  || window.innerWidth;
  canvas.height = canvas.clientHeight || (window.innerHeight - 120);
}
resizeCanvas();

const CANVAS_W = () => canvas.width;
const CANVAS_H = () => canvas.height;

const STREET_W    = 36;
const BLOCK_H     = 220;
const BUILDING_W  = 70;
const BUILDING_H  = 60;
const RESOURCE_R  = 13;
const DOOR_RANGE  = 36;
const PICKUP_RANGE= 30;
const SCROLL_SPEED= 1.4;
const MAX_CARRY   = 2;
// Avatar sits at 35% down — upper half of canvas, more road ahead visible
const PLAYER_SCREEN_Y_FRAC = 0.35;
const DRAIN_NORMAL  = 0.008;
const DRAIN_CRISIS  = 0.04;
const FIRST_CRISIS_BLOCK = 8;

const RESOURCES = [
  { key:'food',      color:'#4ade80', emoji:'🥫' },
  { key:'health',    color:'#60a5fa', emoji:'💊' },
  { key:'education', color:'#a78bfa', emoji:'📚' },
  { key:'lumber',    color:'#fbbf24', emoji:'🪵' },
  { key:'emergency', color:'#f87171', emoji:'🚨' },
  { key:'capital',   color:'#34d399', emoji:'💰' },
];

const BUILDING_DEFS = [
  { id:'kitchen',    label:'Community Kitchen',  res:'food',      emoji:'🍲' },
  { id:'delivery',   label:'Meal Delivery',       res:'food',      emoji:'🚚' },
  { id:'education',  label:'Education Center',    res:'education', emoji:'📖' },
  { id:'housing',    label:'Housing Project',     res:'lumber',    emoji:'🏠' },
  { id:'hygiene',    label:'Hygiene Station',     res:'health',    emoji:'🚿' },
  { id:'clinic',     label:'Health Clinic',       res:'health',    emoji:'🏥' },
  { id:'business',   label:'Business Hub',        res:'capital',   emoji:'💼' },
  { id:'emergency',  label:'Emergency Relief',    res:'emergency', emoji:'🚨' },
  { id:'investment', label:'Investment Project',  res:'capital',   emoji:'📈' },
  { id:'payout',     label:'Community Payout',    res:'capital',   emoji:'🤝' },
];

const MILESTONES = [5, 10, 20, 35, 50, 75, 100];
const CRISIS_EVENTS = [
  { name: '🦠 Health Crisis!', targets: ['hygiene','clinic'] },
  { name: '⚡ Blackout!',        targets: ['emergency','kitchen','delivery'] },
];

const ctx = canvas.getContext('2d');
let worldY = 0;
let resources = [], buildings = [];
let player = { x: 0, screenY: 0 };
let inventory = [];
let score = 0, gameOver = false, animFrame;
let crisisActive = {}, milestonePassed = new Set();
let buildingDefIdx = 0, generatedTo = 0;
let blocksTraveled = 0, nextCrisisBlock = FIRST_CRISIS_BLOCK, crisisIdx = 0;
let sliderValue = 0.5;
let depositCooldown = 0;
const MIN_PX = 18;
const STREET_X = () => [CANVAS_W() * 0.28, CANVAS_W() * 0.68];
const MAX_PX = () => CANVAS_W() - 18;

function playerWorldY() { return worldY + player.screenY; }

function generateChunk(startY) {
  const [sx0, sx1] = STREET_X();
  const lb = BUILDING_DEFS[buildingDefIdx++ % BUILDING_DEFS.length];
  const rb = BUILDING_DEFS[buildingDefIdx++ % BUILDING_DEFS.length];
  const by = startY + BLOCK_H * 0.3;

  buildings.push({ id:lb.id+'_'+startY, def:lb, x:sx0-STREET_W/2-BUILDING_W-4, worldY:by, w:BUILDING_W, h:BUILDING_H, level:65+Math.random()*20, doorSide:'right' });
  buildings.push({ id:rb.id+'_'+startY, def:rb, x:sx1+STREET_W/2+4,            worldY:by, w:BUILDING_W, h:BUILDING_H, level:65+Math.random()*20, doorSide:'left' });

  // Spawn resources in the MEDIAN between the two streets
  const medianLeft  = sx0 + STREET_W / 2 + 6;
  const medianRight = sx1 - STREET_W / 2 - 6;
  const medianW = medianRight - medianLeft;

  const n = 2 + Math.floor(Math.random() * 2);
  for (let i = 0; i < n; i++) {
    const res = RESOURCES[Math.floor(Math.random() * RESOURCES.length)];
    const rx = medianLeft + Math.random() * medianW;
    resources.push({
      id:'r'+startY+'_'+i,
      type:res.key, color:res.color, emoji:res.emoji,
      x: rx,
      worldY: startY + BLOCK_H * (0.15 + Math.random() * 0.7),
      active: true,
    });
  }
  generatedTo = startY + BLOCK_H;
}

function ensureGenerated() {
  const need = worldY + CANVAS_H() + BLOCK_H * 2;
  while (generatedTo < need) generateChunk(generatedTo);
}

function toScreen(wy) { return wy - worldY; }

function drawStreets() {
  const CH = CANVAS_H();
  STREET_X().forEach(sx => {
    ctx.fillStyle = '#1f2937';
    ctx.fillRect(sx - STREET_W/2, 0, STREET_W, CH);
    ctx.setLineDash([12,10]);
    ctx.strokeStyle = '#374151'; ctx.lineWidth = 1.5;
    ctx.beginPath();
    const off = (worldY * 0.5) % 22;
    ctx.moveTo(sx, -off); ctx.lineTo(sx, CH+22);
    ctx.stroke(); ctx.setLineDash([]);
  });
}

function drawMedian() {
  // Subtle median strip highlight so player knows items live here
  const [sx0, sx1] = STREET_X();
  const mx = sx0 + STREET_W/2;
  const mw = sx1 - STREET_W/2 - mx;
  const CH = CANVAS_H();
  ctx.save();
  ctx.globalAlpha = 0.06;
  ctx.fillStyle = '#f8fafc';
  ctx.fillRect(mx, 0, mw, CH);
  ctx.globalAlpha = 1;
  // Dotted center line
  ctx.setLineDash([6, 14]);
  ctx.strokeStyle = '#334155'; ctx.lineWidth = 1;
  const cx = mx + mw/2;
  const off = (worldY * 0.3) % 20;
  ctx.beginPath(); ctx.moveTo(cx, -off); ctx.lineTo(cx, CH+20);
  ctx.stroke(); ctx.setLineDash([]);
  ctx.restore();
}

function drawBuildings() {
  const CH = CANVAS_H();
  buildings.forEach(b => {
    const sy = toScreen(b.worldY);
    if (sy > CH+20 || sy+b.h < -20) return;
    const isCrisis = crisisActive[b.id];
    const lvl = Math.max(0, b.level);
    const res = RESOURCES.find(r => r.key === b.def.res);
    const col = res?.color || '#888';
    ctx.save();
    ctx.globalAlpha = 0.15 + (lvl/100)*0.4;
    ctx.fillStyle = col;
    ctx.beginPath(); ctx.roundRect(b.x, sy, b.w, b.h, 6); ctx.fill();
    ctx.globalAlpha = 1;
    ctx.strokeStyle = isCrisis ? '#ef4444' : (lvl<30 ? '#f59e0b' : col+'bb');
    ctx.lineWidth = isCrisis ? 2.5 : 1.5;
    ctx.beginPath(); ctx.roundRect(b.x, sy, b.w, b.h, 6); ctx.stroke();
    ctx.restore();
    ctx.font = '20px serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(b.def.emoji, b.x+b.w/2, sy+b.h*0.38);
    const bx = b.x+4, bw = b.w-8;
    ctx.fillStyle = '#111827'; ctx.fillRect(bx, sy+b.h-10, bw, 6);
    ctx.fillStyle = lvl>50?'#4ade80':lvl>25?'#fbbf24':'#ef4444';
    ctx.fillRect(bx, sy+b.h-10, bw*(lvl/100), 6);
    const doorX = b.doorSide==='right' ? b.x+b.w : b.x;
    ctx.fillStyle = '#fbbf24';
    ctx.beginPath(); ctx.arc(doorX, sy+b.h/2, 5, 0, Math.PI*2); ctx.fill();
  });
}

function drawResources() {
  const CH = CANVAS_H();
  resources.forEach(r => {
    if (!r.active) return;
    const sy = toScreen(r.worldY);
    if (sy < -20 || sy > CH+20) return;
    ctx.beginPath(); ctx.arc(r.x, sy, RESOURCE_R, 0, Math.PI*2);
    ctx.fillStyle = r.color; ctx.fill();
    ctx.strokeStyle = '#ffffff22'; ctx.lineWidth = 1; ctx.stroke();
    ctx.font = '12px serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(r.emoji, r.x, sy);
  });
}

function drawPlayer() {
  const sy = player.screenY;
  if (inventory.length > 0) {
    const col = RESOURCES.find(r => r.key===inventory[0].type)?.color || '#fff';
    ctx.save(); ctx.shadowBlur = 18; ctx.shadowColor = col;
    ctx.beginPath(); ctx.arc(player.x, sy, 17, 0, Math.PI*2);
    ctx.strokeStyle = col+'88'; ctx.lineWidth = 2; ctx.stroke();
    ctx.restore();
  }
  ctx.font = '26px serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('🧑', player.x, sy);
}

function drawCrisisBanner() {
  const msgs = [...new Set(Object.values(crisisActive).filter(Boolean))];
  if (!msgs.length) return;
  const CW = CANVAS_W();
  ctx.save(); ctx.globalAlpha = 0.88;
  ctx.fillStyle = '#7f1d1d'; ctx.fillRect(0, 0, CW, 26);
  ctx.globalAlpha = 1;
  ctx.fillStyle = '#fca5a5'; ctx.font = 'bold 11px sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(msgs[0], CW/2, 13);
  ctx.restore();
}

function render() {
  const CW = CANVAS_W(), CH = CANVAS_H();
  ctx.fillStyle = '#0f172a'; ctx.fillRect(0, 0, CW, CH);
  drawStreets();
  drawMedian();
  drawBuildings();
  drawResources();
  drawPlayer();
  drawCrisisBanner();
}

function updateInventoryUI() {
  for (let i = 0; i < 2; i++) {
    const slot = document.getElementById('slot'+i);
    if (inventory[i]) {
      const res = RESOURCES.find(r => r.key===inventory[i].type);
      slot.style.borderColor = res.color;
      slot.style.background = res.color+'33';
      slot.textContent = res.emoji;
    } else {
      slot.style.borderColor = '#4b5563';
      slot.style.background = '#1f2937';
      slot.textContent = '';
    }
  }
}

function updateFingerPad() {
  const pad = document.getElementById('fingerPad');
  const knob = document.getElementById('fingerKnob');
  const fill = document.getElementById('fingerFill');
  const w = pad.clientWidth, kw = 48;
  const left = sliderValue * (w - kw);
  knob.style.left = left + 'px';
  fill.style.width = Math.max(0, left + kw/2) + 'px';
  player.x = MIN_PX + sliderValue * (MAX_PX() - MIN_PX);
}

function setSliderFromX(clientX) {
  const rect = document.getElementById('fingerPad').getBoundingClientRect();
  sliderValue = Math.max(0, Math.min(1, (clientX - rect.left) / rect.width));
  updateFingerPad();
}

['touchstart','touchmove'].forEach(ev => {
  document.getElementById('fingerPad').addEventListener(ev, e => {
    e.preventDefault(); setSliderFromX(e.touches[0].clientX);
  }, { passive:false });
});

function tryPickup() {
  if (inventory.length >= MAX_CARRY) return;
  const py = playerWorldY(), px = player.x;
  for (let r of resources) {
    if (!r.active) continue;
    if (Math.hypot(r.x-px, r.worldY-py) < PICKUP_RANGE) {
      inventory.push(r); r.active = false; updateInventoryUI(); break;
    }
  }
}

function tryDeposit() {
  if (!inventory.length || depositCooldown > 0) return;
  const py = playerWorldY(), px = player.x;
  for (let b of buildings) {
    const doorX = b.doorSide==='right' ? b.x+b.w : b.x;
    if (Math.hypot(doorX-px, b.worldY+b.h/2-py) < DOOR_RANGE) {
      const mi = inventory.findIndex(i => i.type===b.def.res);
      if (mi >= 0) {
        inventory.splice(mi, 1);
        b.level = Math.min(100, b.level+28);
        score += 2;
        document.getElementById('scoreDisplay').textContent = score;
        updateInventoryUI();
        depositCooldown = 60;
      } else {
        b.level = Math.max(0, b.level-8);
        const it = inventory.shift();
        resources.push({ ...it, active:true, worldY:py+20, x:px+25, id:'d'+Date.now() });
        updateInventoryUI();
        depositCooldown = 45;
      }
      return;
    }
  }
}

function checkCrisis(blocks) {
  if (blocks < nextCrisisBlock) return;
  const c = CRISIS_EVENTS[crisisIdx++ % CRISIS_EVENTS.length];
  nextCrisisBlock = blocks + 5 + Math.floor(Math.random()*4);
  buildings.forEach(b => { if (c.targets.includes(b.def.id)) crisisActive[b.id] = c.name; });
  const clearMs = (BLOCK_H / SCROLL_SPEED) * 3 * (1000/60);
  setTimeout(() => buildings.forEach(b => { if (crisisActive[b.id]===c.name) delete crisisActive[b.id]; }), clearMs);
  showBanner(c.name, '#f87171');
}

function checkMilestone(blocks) {
  const m = MILESTONES.find(m => m===blocks && !milestonePassed.has(m));
  if (!m) return;
  milestonePassed.add(m);
  pauseForMilestone(m);
}

function pauseForMilestone(blocks) {
  cancelAnimationFrame(animFrame);
  const card = document.getElementById('overlayCard');
  card.className = 'rounded-2xl border border-emerald-600 bg-emerald-950/90 p-7 max-w-sm w-full text-center';
  document.getElementById('overlayIcon').textContent = '🏙️';
  document.getElementById('overlayTitle').textContent = blocks+' Blocks — Milestone!';
  document.getElementById('overlayMsg').textContent = milestoneMsg(blocks);
  const btn = document.getElementById('overlayBtn');
  btn.textContent = 'Keep Running →';
  btn.onclick = () => { document.getElementById('overlay').classList.add('hidden'); animFrame = requestAnimationFrame(loop); };
  document.getElementById('overlay').classList.remove('hidden');
}

const MILESTONE_MSGS = {
  5:   'The Community Kitchen is running. 180 meals served today.',
  10:  'Participation hits 12%. Roles are filled. The fund is working.',
  20:  'Health Crisis survived. Emergency Relief activated in 48 hours — no committee needed.',
  35:  'Community Olympics raised $14,000. Local businesses are growing.',
  50:  'Blackout survived. Zero hospitalizations. Public Furnace stations held.',
  75:  'Emergency Fund fully replenished. All 10 projects active.',
  100: 'Year-end: participation at 19%. This is what an MDF community looks like.',
};
function milestoneMsg(b) { return MILESTONE_MSGS[b] || `${b} blocks. The community is stronger.`; }

function showBanner(msg, color='#fbbf24') {
  const el = document.getElementById('milestoneMsg');
  el.textContent = msg; el.style.color = color;
  el.classList.remove('hidden');
  setTimeout(() => el.classList.add('hidden'), 3500);
}

function triggerGameOver(b) {
  if (gameOver) return;
  gameOver = true; cancelAnimationFrame(animFrame);
  const card = document.getElementById('overlayCard');
  card.className = 'rounded-2xl border border-red-700 bg-red-950/90 p-7 max-w-sm w-full text-center';
  document.getElementById('overlayIcon').textContent = b.def.emoji;
  document.getElementById('overlayTitle').textContent = b.def.label+' collapsed.';
  document.getElementById('overlayMsg').textContent = `${score} block${score!==1?'s':''} traveled. One collapse cascades. This is why allocation matters.`;
  const btn = document.getElementById('overlayBtn');
  btn.textContent = 'Run Again';
  btn.onclick = () => { document.getElementById('overlay').classList.add('hidden'); initGame(); };
  document.getElementById('overlay').classList.remove('hidden');
}

function loop() {
  if (gameOver) return;
  worldY += SCROLL_SPEED;
  player.screenY = CANVAS_H() * PLAYER_SCREEN_Y_FRAC;
  if (depositCooldown > 0) depositCooldown--;

  const newBlocks = Math.floor(worldY / BLOCK_H);
  if (newBlocks > blocksTraveled) {
    blocksTraveled = newBlocks;
    score = Math.max(score, blocksTraveled);
    document.getElementById('scoreDisplay').textContent = score;
    checkMilestone(blocksTraveled);
    checkCrisis(blocksTraveled);
  }

  buildings.forEach(b => {
    const sy = toScreen(b.worldY);
    if (sy < -BUILDING_H || sy > CANVAS_H()+BUILDING_H) return;
    const drain = crisisActive[b.id] ? DRAIN_CRISIS : DRAIN_NORMAL;
    b.level -= drain;
    if (b.level <= 0) { b.level = 0; triggerGameOver(b); }
  });

  tryPickup(); tryDeposit();

  const cullY = worldY - BLOCK_H;
  resources = resources.filter(r => r.worldY > cullY);
  buildings = buildings.filter(b => b.worldY > cullY);

  ensureGenerated();
  render();
  animFrame = requestAnimationFrame(loop);
}

function initGame() {
  worldY = 0; resources = []; buildings = [];
  player = { x: CANVAS_W()/2, screenY: CANVAS_H()*PLAYER_SCREEN_Y_FRAC };
  inventory = []; score = 0; gameOver = false;
  blocksTraveled = 0; nextCrisisBlock = FIRST_CRISIS_BLOCK; crisisIdx = 0;
  crisisActive = {}; buildingDefIdx = 0; generatedTo = 0;
  milestonePassed = new Set(); sliderValue = 0.5; depositCooldown = 0;
  document.getElementById('scoreDisplay').textContent = '0';
  updateInventoryUI(); ensureGenerated(); updateFingerPad();
  cancelAnimationFrame(animFrame);
  animFrame = requestAnimationFrame(loop);
}

window.addEventListener('resize', () => { resizeCanvas(); updateFingerPad(); });
initGame();
</script>
</body>
</html>
